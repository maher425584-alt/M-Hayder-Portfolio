<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Private Dashboard Login | M Hayder</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #2563eb;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            text-align: center;
            color: #111827;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 18px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">
            <img src="HAIDER.jpeg" alt="M Hayder">
        </div>

        <h1>Private Dashboard</h1>

        <p class="subtitle">
            Login to access the Parent Dashboard
        </p>

        <form id="loginForm">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                Login
            </button>

        </form>

        <div id="message"></div>

        <a href="index.html" class="back">
            ← Back to Portfolio
        </a>

    </div>


    <script>
        const SUPABASE_URL =
            "https://wfwxidbdyqwkqsbaxtlj.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_3OKrT7wF_P5P6vitgWpFJw_Opq-NvTr";


        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");


        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            message.textContent = "";
            message.style.color = "#6b7280";


            try {

                const response = await fetch(
                    `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
                    {
                        method: "POST",

                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error_description ||
                        data.msg ||
                        "Invalid email or password."
                    );
                }


                sessionStorage.setItem(
                    "parent_access_token",
                    data.access_token
                );

                sessionStorage.setItem(
                    "parent_refresh_token",
                    data.refresh_token
                );

                sessionStorage.setItem(
                    "parent_user",
                    JSON.stringify(data.user)
                );


                message.textContent =
                    "Login successful. Opening dashboard...";

                message.style.color = "#16a34a";


                setTimeout(() => {

                    window.location.href =
                        "dashboard.html";

                }, 700);


            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );

                message.textContent =
                    error.message;

                message.style.color = "#dc2626";

                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }

        });
    </script>

</body>
</html>
