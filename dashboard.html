```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Private Parent Dashboard | M Hayder</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #111827;
            min-height: 100vh;
        }

        .header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 5%;
        }

        .header-inner {
            max-width: 1100px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .brand {
            font-size: 22px;
            font-weight: 800;
        }

        .brand span {
            color: #2563eb;
        }

        .logout-btn {
            border: none;
            background: #dc2626;
            color: white;
            padding: 10px 18px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
        }

        .logout-btn:hover {
            background: #b91c1c;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading small {
            color: #2563eb;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .heading h1 {
            margin-top: 8px;
            font-size: 34px;
        }

        .heading p {
            margin-top: 8px;
            color: #6b7280;
        }

        .dashboard-card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            margin-bottom: 25px;
        }

        .dashboard-top {
            padding: 22px 25px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .dashboard-top h2 {
            font-size: 21px;
        }

        .status {
            display: block;
            margin-top: 6px;
            color: #16a34a;
            font-size: 13px;
        }

        .notification-list,
        .location-list {
            padding: 20px;
        }

        .notification-card,
        .location-card {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 14px;
            background: #fafafa;
        }

        .notification-card:last-child,
        .location-card:last-child {
            margin-bottom: 0;
        }

        .notification-card-top,
        .location-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .notification-app {
            font-weight: 700;
            color: #2563eb;
        }

        .notification-time,
        .location-time {
            color: #6b7280;
            font-size: 12px;
            text-align: right;
        }

        .notification-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .notification-message {
            color: #4b5563;
            line-height: 1.5;
            word-break: break-word;
        }

        .notification-device,
        .location-device {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #e5e7eb;
            color: #6b7280;
            font-size: 13px;
        }

        .location-device a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 700;
        }

        .location-device a:hover {
            text-decoration: underline;
        }

        .location-coordinates {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }

        .coordinate-box {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 12px;
        }

        .coordinate-label {
            display: block;
            color: #6b7280;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .coordinate-value {
            font-weight: 700;
            word-break: break-word;
        }

        .notification-empty,
        .location-empty {
            text-align: center;
            padding: 45px 20px;
            color: #6b7280;
        }

        .notification-empty span,
        .location-empty span {
            display: block;
            font-size: 35px;
            margin-bottom: 12px;
        }

        .notification-empty p,
        .location-empty p {
            font-weight: 700;
            color: #374151;
            margin-bottom: 6px;
        }

        .error-message {
            color: #dc2626 !important;
        }

        @media (max-width: 650px) {

            .header-inner {
                align-items: flex-start;
            }

            .brand {
                font-size: 18px;
            }

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .heading h1 {
                font-size: 27px;
            }

            .dashboard-top {
                align-items: flex-start;
                flex-direction: column;
            }

            .notification-card-top,
            .location-card-top {
                align-items: flex-start;
                flex-direction: column;
            }

            .notification-time,
            .location-time {
                text-align: left;
            }

            .location-coordinates {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="header-inner">

        <div class="brand">
            M Hayder <span>• Private Dashboard</span>
        </div>

        <button
            id="logoutButton"
            class="logout-btn"
            type="button">
            Logout
        </button>

    </div>

</header>


<main class="container">

    <div class="heading">

        <small>PRIVATE AREA</small>

        <h1>Parent Dashboard</h1>

        <p>
            Notifications and locations received from the connected Android device.
        </p>

    </div>


    <!-- ========================= -->
    <!-- NOTIFICATIONS -->
    <!-- ========================= -->

    <section class="dashboard-card">

        <div class="dashboard-top">

            <div>

                <h2>Recent Notifications</h2>

                <span id="notificationStatus" class="status">
                    Connecting...
                </span>

            </div>

        </div>


        <div
            id="notificationList"
            class="notification-list">

            <div class="notification-empty">

                <span>🔄</span>

                <p>Loading notifications...</p>

            </div>

        </div>

    </section>


    <!-- ========================= -->
    <!-- LOCATIONS -->
    <!-- ========================= -->

    <section class="dashboard-card">

        <div class="dashboard-top">

            <div>

                <h2>Locations</h2>

                <span id="locationStatus" class="status">
                    Connecting...
                </span>

            </div>

        </div>


        <div
            id="locationList"
            class="location-list">

            <div class="location-empty">

                <span>📍</span>

                <p>Loading locations...</p>

            </div>

        </div>

    </section>

</main>


<!-- IMPORTANT:
     Dashboard ka JavaScript sirf script.js se chalega.
     Yahan duplicate JavaScript nahi hai.
-->

<script src="script.js"></script>

</body>
</html>
```
