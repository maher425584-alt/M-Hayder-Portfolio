<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Private Parent Dashboard | M Hayder</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #111827;
            min-height: 100vh;
        }

        .header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 5%;
        }

        .header-inner {
            max-width: 1100px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .brand {
            font-size: 22px;
            font-weight: 800;
        }

        .brand span {
            color: #2563eb;
        }

        .logout-btn {
            border: none;
            background: #dc2626;
            color: white;
            padding: 10px 18px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
        }

        .logout-btn:hover {
            background: #b91c1c;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading small {
            color: #2563eb;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .heading h1 {
            margin-top: 8px;
            font-size: 34px;
        }

        .heading p {
            margin-top: 8px;
            color: #6b7280;
        }

        .dashboard-card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .dashboard-top {
            padding: 22px 25px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .dashboard-top h2 {
            font-size: 21px;
        }

        #notificationStatus {
            display: block;
            margin-top: 6px;
            color: #16a34a;
            font-size: 13px;
        }

        .refresh-btn {
            border: none;
            background: #2563eb;
            color: white;
            padding: 11px 18px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
        }

        .refresh-btn:hover {
            background: #1d4ed8;
        }

        .notification-list {
            padding: 20px;
        }

        .notification-card {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 14px;
            background: #fafafa;
        }

        .notification-card:last-child {
            margin-bottom: 0;
        }

        .notification-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .notification-app {
            font-weight: 700;
            color: #2563eb;
        }

        .notification-time {
            color: #6b7280;
            font-size: 12px;
            text-align: right;
        }

        .notification-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .notification-message {
            color: #4b5563;
            line-height: 1.5;
            word-break: break-word;
        }

        .notification-device {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #e5e7eb;
            color: #6b7280;
            font-size: 13px;
        }

        .notification-empty {
            text-align: center;
            padding: 45px 20px;
            color: #6b7280;
        }

        .notification-empty span {
            display: block;
            font-size: 35px;
            margin-bottom: 12px;
        }

        .notification-empty p {
            font-weight: 700;
            color: #374151;
            margin-bottom: 6px;
        }

        .error-message {
            color: #dc2626 !important;
        }

        @media (max-width: 650px) {

            .header-inner {
                align-items: flex-start;
            }

            .brand {
                font-size: 18px;
            }

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .heading h1 {
                font-size: 27px;
            }

            .dashboard-top {
                align-items: flex-start;
                flex-direction: column;
            }

            .refresh-btn {
                width: 100%;
            }

            .notification-card-top {
                align-items: flex-start;
                flex-direction: column;
            }

            .notification-time {
                text-align: left;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="header-inner">

        <div class="brand">
            M Hayder <span>• Private Dashboard</span>
        </div>

        <button
            id="logoutButton"
            class="logout-btn"
            type="button">
            Logout
        </button>

    </div>

</header>


<main class="container">

    <div class="heading">

        <small>PRIVATE AREA</small>

        <h1>Parent Dashboard</h1>

        <p>
            Notifications received from the connected Android device.
        </p>

    </div>


    <section class="dashboard-card">

        <div class="dashboard-top">

            <div>

                <h2>Recent Notifications</h2>

                <span id="notificationStatus">
                    Connecting...
                </span>

            </div>

            <button
                id="refreshNotifications"
                class="refresh-btn"
                type="button">
                Refresh
            </button>

        </div>


        <div
            id="notificationList"
            class="notification-list">

            <div class="notification-empty">

                <span>🔄</span>

                <p>Loading notifications...</p>

            </div>

        </div>

    </section>

</main>


<script>

    // ==================================================
    // SUPABASE
    // ==================================================

    const SUPABASE_URL =
        "https://wfwxidbdyqwkqsbaxtlj.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_3OKrT7wF_P5P6vitgWpFJw_Opq-NvTr";


    // ==================================================
    // SESSION SECURITY CHECK
    // ==================================================

    const accessToken =
        sessionStorage.getItem("parent_access_token");


    if (!accessToken) {

        window.location.replace("login.html");

    }


    // ==================================================
    // ELEMENTS
    // ==================================================

    const notificationList =
        document.getElementById("notificationList");

    const notificationStatus =
        document.getElementById("notificationStatus");

    const refreshNotifications =
        document.getElementById("refreshNotifications");

    const logoutButton =
        document.getElementById("logoutButton");


    // ==================================================
    // LOGOUT
    // ==================================================

    logoutButton.addEventListener("click", () => {

        sessionStorage.removeItem("parent_access_token");
        sessionStorage.removeItem("parent_refresh_token");
        sessionStorage.removeItem("parent_user");

        window.location.replace("login.html");

    });


    // ==================================================
    // HTML SECURITY
    // ==================================================

    function escapeHTML(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    // ==================================================
    // LOAD NOTIFICATIONS
    // ==================================================

    async function loadNotifications() {

        if (!notificationList) {
            return;
        }


        notificationList.innerHTML = `
            <div class="notification-empty">
                <span>🔄</span>
                <p>Loading notifications...</p>
            </div>
        `;


        notificationStatus.textContent =
            "Connecting...";


        try {

            const url =
                `${SUPABASE_URL}/rest/v1/notifications` +
                `?select=id,device_id,app_name,title,message,received_at` +
                `&order=received_at.desc` +
                `&limit=100`;


            const response = await fetch(url, {

                method: "GET",

                headers: {

                    "apikey": SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${accessToken}`,

                    "Content-Type":
                        "application/json"

                }

            });


            const responseText =
                await response.text();


            console.log(
                "Supabase status:",
                response.status
            );


            console.log(
                "Supabase response:",
                responseText
            );


            if (!response.ok) {

                throw new Error(
                    `Supabase returned ${response.status}: ${responseText}`
                );

            }


            const notifications =
                JSON.parse(responseText);


            displayNotifications(
                notifications
            );


            notificationStatus.textContent =
                `● Connected • ${notifications.length} notifications`;

        }


        catch (error) {

            console.error(
                "Notification error:",
                error
            );


            notificationList.innerHTML = `

                <div class="notification-empty">

                    <span>⚠️</span>

                    <p class="error-message">
                        Unable to load notifications
                    </p>

                    <small>
                        ${escapeHTML(error.message)}
                    </small>

                </div>

            `;


            notificationStatus.textContent =
                "● Connection Error";

        }

    }


    // ==================================================
    // DISPLAY NOTIFICATIONS
    // ==================================================

    function displayNotifications(
        notifications
    ) {

        if (
            !Array.isArray(notifications) ||
            notifications.length === 0
        ) {

            notificationList.innerHTML = `

                <div class="notification-empty">

                    <span>🔔</span>

                    <p>No notifications yet</p>

                    <small>
                        Notifications from the Android app
                        will appear here.
                    </small>

                </div>

            `;

            return;

        }


        notificationList.innerHTML = "";


        notifications.forEach(
            notification => {

                const card =
                    document.createElement("div");


                card.className =
                    "notification-card";


                const appName =
                    notification.app_name ||
                    "Unknown App";


                const title =
                    notification.title ||
                    "Notification";


                const message =
                    notification.message ||
                    "";


                const deviceId =
                    notification.device_id ||
                    "Unknown Device";


                const receivedAt =
                    notification.received_at;


                let formattedTime =
                    "Unknown time";


                if (receivedAt) {

                    const date =
                        new Date(receivedAt);


                    if (
                        !isNaN(
                            date.getTime()
                        )
                    ) {

                        formattedTime =
                            date.toLocaleString();

                    }

                }


                card.innerHTML = `

                    <div class="notification-card-top">

                        <div class="notification-app">
                            📱
                            ${escapeHTML(appName)}
                        </div>

                        <div class="notification-time">
                            ${escapeHTML(formattedTime)}
                        </div>

                    </div>


                    <div class="notification-title">
                        ${escapeHTML(title)}
                    </div>


                    <div class="notification-message">
                        ${escapeHTML(message)}
                    </div>


                    <div class="notification-device">
                        Device:
                        ${escapeHTML(deviceId)}
                    </div>

                `;


                notificationList.appendChild(
                    card
                );

            }
        );

    }


    // ==================================================
    // REFRESH
    // ==================================================

    refreshNotifications.addEventListener(
        "click",
        loadNotifications
    );


    // ==================================================
    // AUTOMATIC REFRESH
    // ==================================================

    setInterval(
        loadNotifications,
        10000
    );


    // ==================================================
    // START
    // ==================================================

    if (accessToken) {
        loadNotifications();
    }

</script>

</body>
</html>
